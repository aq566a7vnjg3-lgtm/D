<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>西暦・和暦・年齢 変換</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;animation:none!important;transition:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:16px;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Yu Gothic",sans-serif;
}
main{max-width:620px;margin:0 auto}
h1{margin:0 0 18px;font-size:22px;line-height:1.3}
.row{display:grid;grid-template-columns:1fr 76px 76px;gap:8px}
label{display:block;margin:0 0 5px;font-size:12px;color:#666}
input{
  width:100%;
  height:44px;
  margin:0;
  padding:0 10px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
  color:#111;
  font:inherit;
  font-size:16px;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
}
input:focus{border-color:#f07822}
.note{margin:9px 0 0;font-size:12px;color:#777;line-height:1.45}
#error{min-height:18px;margin-top:5px;font-size:12px;color:#c00}
.results{margin-top:14px;border-top:1px solid #ddd}
.result{
  display:grid;
  grid-template-columns:76px 1fr;
  align-items:center;
  min-height:52px;
  border-bottom:1px solid #ddd
}
.result b{font-size:12px;color:#666}
.result span{font-size:22px;font-weight:700;word-break:break-word}
.empty{color:#bbb}
@media(max-width:520px){
  body{padding:12px}
  h1{font-size:20px}
  .row{grid-template-columns:1fr 70px 70px}
}
</style>
</head>
<body>
<main>
  <h1>西暦・和暦・年齢 変換</h1>

  <div class="row">
    <div>
      <label for="year">年</label>
      <input id="year" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="1988 / 平成30 / H30 / R2">
    </div>
    <div>
      <label for="month">月</label>
      <input id="month" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="任意">
    </div>
    <div>
      <label for="day">日</label>
      <input id="day" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="任意">
    </div>
  </div>

  <div class="note">年は西暦・和暦どちらでも入力可。月・日まで入れると年齢も表示。</div>
  <div id="error"></div>

  <div class="results">
    <div class="result"><b>西暦</b><span id="western" class="empty">—</span></div>
    <div class="result"><b>和暦</b><span id="era" class="empty">—</span></div>
    <div class="result"><b>年齢</b><span id="age" class="empty">—</span></div>
  </div>
</main>

<script>
"use strict";

const Y=document.getElementById("year"),
      M=document.getElementById("month"),
      D=document.getElementById("day"),
      W=document.getElementById("western"),
      E=document.getElementById("era"),
      A=document.getElementById("age"),
      X=document.getElementById("error");

const ERAS=[
  ["令和","R",2019,5,1,2018,0],
  ["平成","H",1989,1,8,1988,31],
  ["昭和","S",1926,12,25,1925,64],
  ["大正","T",1912,7,30,1911,15],
  ["明治","M",1868,1,25,1867,45]
];

function norm(s){
  return s.trim()
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248))
    .replace(/[Ｒｒ]/g,"R").replace(/[Ｈｈ]/g,"H")
    .replace(/[Ｓｓ]/g,"S").replace(/[Ｔｔ]/g,"T")
    .replace(/[Ｍｍ]/g,"M").replace(/\s/g,"");
}
function parseYear(s){
  s=norm(s);
  if(!s)return null;

  let m=s.match(/^(\d{3,4})年?$/);
  if(m)return +m[1];

  for(let i=0;i<ERAS.length;i++){
    const e=ERAS[i];
    m=s.match(new RegExp("^(?:"+e[0]+"|"+e[1]+")(元|\\d{1,2})年?$","i"));
    if(m){
      const n=m[1]==="元"?1:+m[1];
      if(n<1||(e[6]&&n>e[6]))return NaN;
      return e[5]+n;
    }
  }
  return NaN;
}
function eraText(y){
  if(y===2019)return "平成31年 / 令和元年";
  if(y===1989)return "昭和64年 / 平成元年";
  if(y===1926)return "大正15年 / 昭和元年";
  if(y===1912)return "明治45年 / 大正元年";
  if(y>=2020)return "令和"+(y-2018)+"年";
  if(y>=1990)return "平成"+(y-1988)+"年";
  if(y>=1927)return "昭和"+(y-1925)+"年";
  if(y>=1913)return "大正"+(y-1911)+"年";
  if(y>=1868)return "明治"+(y-1867)+"年";
  return "対象外";
}
function eraByDate(y,m,d){
  const n=y*10000+m*100+d;
  for(let i=0;i<ERAS.length;i++){
    const e=ERAS[i], start=e[2]*10000+e[3]*100+e[4];
    if(n>=start){
      const k=y-e[5];
      return e[0]+(k===1?"元":k)+"年";
    }
  }
  return "対象外";
}
function validDate(y,m,d){
  const t=new Date(y,m-1,d);
  return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d;
}
function ageNow(y,m,d){
  const now=new Date(), b=new Date(y,m-1,d);
  if(b>now)return null;
  let a=now.getFullYear()-y;
  const nm=now.getMonth()+1, nd=now.getDate();
  if(nm<m||(nm===m&&nd<d))a--;
  return a;
}
function set(el,v,empty){
  el.textContent=v;
  el.className=empty?"empty":"";
}
function update(){
  X.textContent="";
  const y=parseYear(Y.value);

  if(y===null){
    set(W,"—",1); set(E,"—",1); set(A,"—",1);
    return;
  }
  if(!Number.isFinite(y)||y<1868){
    X.textContent="入力を確認してください";
    set(W,"—",1); set(E,"—",1); set(A,"—",1);
    return;
  }

  set(W,y+"年",0);

  const ms=norm(M.value), ds=norm(D.value);
  if(!ms&&!ds){
    set(E,eraText(y),0); set(A,"—",1);
    return;
  }
  if(!ms||!ds){
    X.textContent="月・日は両方入力してください";
    set(E,eraText(y),0); set(A,"—",1);
    return;
  }

  const m=+ms,d=+ds;
  if(!validDate(y,m,d)){
    X.textContent="月・日を確認してください";
    set(E,eraText(y),0); set(A,"—",1);
    return;
  }

  set(E,eraByDate(y,m,d),0);
  const a=ageNow(y,m,d);
  set(A,a===null?"未来":a+"歳",0);
}

Y.addEventListener("input",update,{passive:true});
M.addEventListener("input",update,{passive:true});
D.addEventListener("input",update,{passive:true});
update();
</script>
</body>
</html>
